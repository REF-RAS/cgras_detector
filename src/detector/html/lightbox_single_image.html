<!DOCTYPE html>
<html>

    <link href="scripts/nanogallery2.min.css" rel="stylesheet" type="text/css">
    <script type="text/javascript" src="scripts/jquery.nanogallery2.min.js"></script>
    
</head>

<body>

        "thumbnailLabel": {

          "openOnStart": "ID1"

        "thumbnailOpenImage": true,
        "viewerGallery ": "none",
        "viewerTools" : { "topLeft": "", "topRight": "rotateLeft, rotateRight, zoomButton, fullscreenButton,"}

     <a href="[[IMAGE_URL]]" data-ngid="ID1" target="_blank" data-ngdesc=""></a>

<script>

        $("#ngy2p").on( 'galleryRenderEnd.nanogallery2', function(){
        window.location.hash = '#nanogallery/ngy2p/0/ID1';
        });
    })
