<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <script src="scripts/jquery.min.js" type="text/javascript"></script>
    <link rel="stylesheet" href="scripts/foundation-renamed.min.css">
    <script src="scripts/foundation-renamed.min.js"></script>
    <link href="scripts/nanogallery2.min.css" rel="stylesheet" type="text/css">
    <script type="text/javascript" src="scripts/jquery.nanogallery2.min.js"></script>

    <style>
        div.scroll {
            margin: 4px, 4px;
            padding: 4px;
            background-color: rgb(255, 255, 255);
            width: auto;
            height: auto;
            overflow-x: scroll;
            overflow-y: hidden;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="grid-container fluid">
        <div class="grid-x grid-margin-x" style="background-color: #cce6ff; padding: 12px 64px;">
            <h5>[[PAGE TITLE]]</h5>
        </div>
    </div>


    <div class="grid-x grid-margin-x">
        <div class="cell medium-12">
            <p class="label primary">The captured image gallery</p>
            <p>The images are arranged in the same structure as the capture grid. Hit the <i class="nGY2Icon-star"></i> to view metadata (if available). Hit other part to view the image.</p>
        </div>
    </div>

    <div class="scroll">
        <div id="nanogallery2_placeholder"></div>
    </div>

    [[MODAL_DIV_LIST]]
    
</body>

<script>
    $(document).foundation();
    jQuery(document).ready(function () {

        jQuery("#nanogallery2_placeholder").nanogallery2({
            thumbnailHeight: 'auto',
            thumbnailWidth: 80,
            thumbnailAlignment: 'centre',
            thumbnailLabel: { display: false },
            thumbnailSelectable: false,
            thumbnailToolbarImage: { topLeft: 'custom1, display' },
            viewerToolbar: { 'display': true, 'standard': 'minimizeButton, label', 'fullWidth': true, 'position': 'top'},
            viewerTools: { 'topLeft': '', 'topRight': 'rotateLeft, rotateRight, zoomButton, fullscreenButton,' },
            fnThumbnailInit: myTnInit,
            fnThumbnailToolCustAction: myTnTool,
            icons: {
                thumbnailCustomTool1: '<i class="nGY2Icon-star"></i>'
            },
            items: [
[[JQUERY_ITEMS]]
            ]
        });

    });
    // Reference: https://codepen.io/Kris-B/pen/RpWKMJ
    function myTnTool(action, item) {
        switch (action) {
            case 'custom1':
                //div_obj = document.getElementById(item.customData)
                //console.dir(div_obj)
                $('#' + item.customData).foundation('open')
                break;
        }
    }

    // Add custom elements after one thumbnail is build
    function myTnInit($e, item, GOMidx) {
    }

    // Set the favorite status
    function TnSetFavorite(item) {
        var c = '#880';
        if (item.customData.favorite) {
            c = '#ff0';
        }
        item.$elt.find('[data-ngy2action="custom1"]').css('color', c);
    }
</script>


</html>
